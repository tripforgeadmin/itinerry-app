# Broadcast slot scheduler — Vercel Hobby allows only daily crons, so GitHub Actions
# ticks the broadcast endpoint every 5 minutes instead. The endpoint fires each rule at
# the first tick at-or-after its own send time and guards against double-firing, so
# extra or late invocations are harmless (GitHub schedules routinely run minutes late).
#
# Setup: add repo secret CRON_SECRET = the same value as the Vercel env var.
name: broadcast-cron

on:
  schedule:
    # Rules choose their own free-form HH:MM times in the admin UI, so this ticks every 5
    # minutes (GitHub's shortest allowed interval; free on public repos) and the endpoint
    # decides which rules are due. A tick with nothing due exits in well under a second.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Call broadcast cron endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://app.itinerry.com/api/cron/broadcast"
